# minamo の構成：4つのサービスが同じネットワークで動く
#   frontend（画面） → backend（API） → db（PostgreSQL） / storage（画像の保存）
services:
  # 画面（Next.js）。外に出すのはこれだけ（サーバーの80番）
  frontend:
    build: ./frontend
    ports:
      - "80:3000"
    environment:
      BACKEND_URL: http://backend:4000   # バックエンドは「backend」という名前で呼べる
    depends_on:
      - backend
    restart: unless-stopped

  # API（Express）。OCR とジャンル分けもここ
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: screenshots
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  # データベース（PostgreSQL）
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # 画像の保存（SeaweedFS：S3 と同じ使い方ができる）
  storage:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - storage-data:/data
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
