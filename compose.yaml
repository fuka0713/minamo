# minamo の構成：4つのサービスが同じネットワークで動く
#   frontend（画面） → backend（API：Express） / backend-py（API：FastAPI）→ db（PostgreSQL） / storage（画像の保存）
services:
  # 画面（Next.js）。外に出すのはこれだけ（サーバーの80番）
  frontend:
    build: ./frontend
    ports:
      - "80:3000"
    environment:
      BACKEND_URL: http://backend:4000        # Express は「backend」という名前で呼べる
      BACKEND_PY_URL: http://backend-py:8000  # FastAPI は「backend-py」という名前で呼べる
    depends_on:
      - backend
      - backend-py
    restart: unless-stopped

  # API（Express）。OCR とジャンル分けもここ
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: screenshots
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  # API（FastAPI）。スクショの登録・解析と、「いつ・どこで思い出すか」を担当。説明ページは /api/docs
  backend-py:
    build: ./backend-py
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: screenshots
      TZ: Asia/Tokyo
      APP_TIMEZONE: Asia/Tokyo
      # お店の情報：dummy（仮のお店・既定）/ overpass（OpenStreetMap で調べる）/ none
      POI_PROVIDER: ${POI_PROVIDER:-dummy}
      # 生成 AI（解析・推薦日・推薦理由）。鍵が入っている方を使う（両方なら LLM_PROVIDER で選ぶ）。どちらも空ならルールで動く
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  # データベース（PostgreSQL）
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # 画像の保存（SeaweedFS：S3 と同じ使い方ができる）
  storage:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - storage-data:/data
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
