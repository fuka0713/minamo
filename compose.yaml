# minamo（すくしょっぷ）の構成：4つのサービスが同じネットワークで動く
#   frontend（画面：nginx が React のビルドを配る） → backend-py（API：FastAPI） → db（PostgreSQL） / storage（画像：SeaweedFS）
# 外に出すのは frontend だけ。API は /api 、Swagger は /api/docs
services:
  frontend:
    build: ./frontend
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend-py
    restart: unless-stopped

  backend-py:
    build: ./backend-py
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: screenshots
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}        # 空なら OCR ＋ルールで解析
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      APP_TIMEZONE: Asia/Tokyo
      ALLOW_GUEST: ${ALLOW_GUEST:-true}            # デモ：メールアドレスなしで入れる
      UPLOAD_LIMIT_PER_10MIN: ${UPLOAD_LIMIT_PER_10MIN:-40}  # 1人10分間に登録できる数
      COOKIE_SECURE: ${COOKIE_SECURE:-false}      # https で公開するなら true
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # 前の試作版（Express）とはテーブルの形が違うので、新しい置き場所にする（前のデータは db-data に残る）
      - db-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - storage-data:/data
    restart: unless-stopped

volumes:
  db-data:
  db-data-v2:
  storage-data:
