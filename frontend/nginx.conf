server {
    listen 80;
    root /usr/share/nginx/html;

    # スクショのアップロード（1枚10MBまで）を通すため、少し余裕を持たせる
    client_max_body_size 12m;

    # /api で始まるものは FastAPI（backend-py コンテナ）へ。Swagger（/api/docs）もここを通る
    location /api/ {
        proxy_pass http://backend-py:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # 解析（OCR・Gemini）に時間がかかることがある
    }

    # それ以外は画面（React）。#ページ名 で切り替えるので index.html を返せばよい
    location / {
        try_files $uri /index.html;
    }
}
