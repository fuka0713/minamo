text x="486" y="1030" font-size="17" font-weight="700" fill="#1e293b">② 給料日リマインド</text><text x="486" y="1052" font-size="15" font-weight="400" fill="#1e293b">仮で毎月25日（土日祝は前の平日）</text><text x="486" y="1072" font-size="15" font-weight="400" fill="#1e293b">ユーザーがあとで変更できる</text><ellipse cx="440" cy="205" rx="170" ry="46" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/><text x="440" y="197" font-size="14" fill="#64748b" text-anchor="middle">UC01</text><text x="440" y="221" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">スクショを取り込む</text><ellipse cx="1080" cy="205" rx="170" ry="46" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/><text x="1080" y="197" font-size="14" fill="#64748b" text-anchor="middle">UC02</text><text x="1080" y="221" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">欲しいものを自動登録する</text><ellipse cx="1080" cy="370" rx="170" ry="46" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="1080" y="356" font-size="14" fill="#64748b" text-anchor="middle">UC12</text><text x="1080" y="377" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">ジャンルに分けて登録する</text><text x="1080" y="399" font-size="15" fill="#475569" text-anchor="middle">システムが自動で分類</text><ellipse cx="560" cy="370" rx="170" ry="46" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/><text x="560" y="356" font-size="14" fill="#64748b" text-anchor="middle">UC13</text><text x="560" y="377" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">ジャンルを修正する</text><text x="560" y="399" font-size="15" fill="#475569" text-anchor="middle">ユーザーが必要なときだけ</text><ellipse cx="650" cy="560" rx="170" ry="46" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/><text x="650" y="546" font-size="14" fill="#64748b" text-anchor="middle">UC03</text><text x="650" y="567" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">思い出すタイミングを決める</text><text x="650" y="589" font-size="15" fill="#475569" text-anchor="middle">AIが自動で提案</text><elli