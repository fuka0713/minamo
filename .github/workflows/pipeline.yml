name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  # ---------- CI：壊れていないかを確認 ----------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 画面（frontend：React + Vite）
      - name: Frontend - install, build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # API（backend-py：FastAPI）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend-py - install, lint, test
        working-directory: backend-py
        run: |
          pip install -r requirements.txt
          ruff check .
          python -m pytest -q

      # Docker でビルドできるか
      - name: Docker compose build
        run: |
          cp .env.example .env
          docker compose build

  # ---------- CD：main にマージされたときだけ公開 ----------
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to server
        run: |
          gcloud compute ssh minamo-server \
            --zone=asia-northeast1-b \
            --tunnel-through-iap \
            --quiet \
            --command="cd /opt/minamo && sudo git pull && sudo docker compose up -d --build --remove-orphans"
